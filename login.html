<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#020617" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>Login | Arunachal Peoples Opinion</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans">

  <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-3xl p-7 shadow-2xl space-y-6">
    <div class="flex flex-col items-center text-center space-y-2">
      <img src="assets/logo.png" alt="Logo" class="w-16 h-16 rounded-2xl object-contain bg-slate-800 p-1.5 border border-slate-700" onerror="this.style.display='none'" />
      <h1 class="text-2xl font-extrabold text-white">Arunachal Peoples Opinion</h1>
      <p class="text-xs text-slate-400 leading-relaxed">
        Sign in with your mobile number. Your phone number stays private and is never shared publicly.
      </p>
    </div>

    <div class="space-y-4">
      <div>
        <label class="text-xs font-semibold text-slate-300">Mobile Number</label>
        <input id="phone-input" type="tel" maxlength="10" placeholder="Enter 10-digit mobile number" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div>
        <div class="flex justify-between items-center">
          <label class="text-xs font-semibold text-slate-300">Verification OTP</label>
          <span class="text-[11px] text-emerald-400 font-semibold">OTP: 123456</span>
        </div>
        <input id="otp-input" type="text" maxlength="6" value="123456" class="w-full mt-1 bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm text-white focus:outline-none focus:border-emerald-500" />
      </div>

      <div class="pt-1 border-t border-slate-800/80">
        <button type="button" onclick="document.getElementById('admin-box').classList.toggle('hidden')" class="text-xs text-slate-400 hover:text-amber-400 font-semibold flex items-center gap-1.5">
          <span>⚙️</span> Admin Access
        </button>
        <div id="admin-box" class="hidden mt-2.5 space-y-1">
          <input id="admin-pin" type="password" placeholder="Enter Admin Passkey (2026)" class="w-full bg-slate-950 border border-amber-700/70 rounded-xl px-4 py-2.5 text-xs text-amber-300 focus:outline-none focus:border-amber-500" />
          <p class="text-[10px] text-amber-400/80">Leave blank for Citizen login. Enter <b>2026</b> for Admin Command Center.</p>
        </div>
      </div>

      <button id="login-btn" onclick="handleLogin()" class="w-full py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-extrabold text-sm transition shadow-lg">
        Verify & Continue
      </button>

      <p id="status-msg" class="text-xs text-center text-slate-400 hidden"></p>
    </div>
  </div>

  <script>
    const API_URL = "https://script.google.com/macros/s/AKfycbzBBlj3H08CzWrEmvXF4RB_MIYtBC2JTXi-bPZXlmUcei_mOFuKXJh83io82sDAgzkxmA/exec";

    function generateUserHash(phone) {
      const str = phone + "_AP_CITIZEN_SALT_2026";
      let h1 = 0xdeadbeef ^ str.length, h2 = 0x41c6ce57 ^ str.length;
      for (let i = 0, ch; i < str.length; i++) {
        ch = str.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h1 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return "usr_" + (h2 >>> 0).toString(16).padStart(8, '0') + (h1 >>> 0).toString(16).padStart(8, '0');
    }

    async function handleLogin() {
      const phone = document.getElementById('phone-input').value.trim().replace(/\D/g, '');
      const otp = document.getElementById('otp-input').value.trim();
      const adminPin = document.getElementById('admin-pin').value.trim();
      const btn = document.getElementById('login-btn');
      const msg = document.getElementById('status-msg');

      if (phone.length !== 10) {
        alert("Please enter a valid 10-digit mobile number.");
        return;
      }
      if (otp !== "123456") {
        alert("Invalid OTP. Please use 123456");
        return;
      }

      const isAdminLogin = adminPin !== "";
      if (isAdminLogin && adminPin !== "2026" && adminPin !== "ADMIN2026") {
        alert("Invalid Admin Passkey. Use 2026 for Admin Access, or leave it blank for Citizen login.");
        return;
      }

      const userHash = generateUserHash(phone);
      btn.disabled = true;
      btn.textContent = "Signing in...";
      msg.textContent = isAdminLogin ? "Opening State Admin Command Center..." : "Loading your profile...";
      msg.classList.remove('hidden');

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "login", userHash, adminPin })
        });
        const data = await res.json();
        if (data && data.ok && data.user) {
          data.user.authorTag = String(userHash).slice(-8);
          data.user.role = isAdminLogin ? "Admin" : "Citizen";
          localStorage.setItem("apo_user", JSON.stringify(data.user));
          window.location.href = isAdminLogin ? "admin.html" : "index.html";
          return;
        }
      } catch (err) {}

      const rand = Math.floor(1000 + Math.random() * 9000);
      const fallbackUser = {
        userHash,
        authorTag: String(userHash).slice(-8),
        role: isAdminLogin ? "Admin" : "Citizen",
        username: isAdminLogin ? `@Admin_${rand}` : `@AP_Citizen_${rand}`,
        displayName: isAdminLogin ? "State Administrator" : "Verified Citizen",
        avatar: "",
        district: "Itanagar Capital Complex",
        address: ""
      };
      localStorage.setItem("apo_user", JSON.stringify(fallbackUser));
      window.location.href = isAdminLogin ? "admin.html" : "index.html";
    }
  </script>
</body>
</html>
